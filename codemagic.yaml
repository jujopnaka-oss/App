workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - android_credentials
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      scripts:
      - name: Generate Android platform files
        script: |
          cp lib/main.dart /tmp/main.dart
          flutter create --platforms=android --project-name chefmate_hub --org com.chefmate .
          cp /tmp/main.dart lib/main.dart
          rm -f test/widget_test.dart
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
