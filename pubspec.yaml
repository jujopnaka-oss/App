name: chefmate_hub
description: Good Meal - cooking and wellness app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  # หลังใส่ไฟล์ฟอนต์ Aston Script ที่ assets/fonts/AstonScript.ttf แล้ว
